
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEUS POP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.top{height:64px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5}
.top b{font-size:21px;font-weight:500}
.top small{display:block;text-align:center;color:#888;font-size:13px;margin-top:2px}
.wrap{max-width:720px;margin:auto;padding:52px 24px 100px}
.profile{display:flex;align-items:center;gap:18px;margin-bottom:48px}
.avatar{width:82px;height:82px;border-radius:50%;background:#e9eee8;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:25px;color:#315a32}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile h1{font-size:38px;font-weight:400;margin:0}
.label{font-size:18px;color:#777;margin:20px 0 12px}
input,textarea{width:100%;border:1.5px solid #e2e3e0;border-radius:16px;padding:17px 20px;background:#f8f8f7;outline:none;font-size:17px}
input:focus,textarea:focus{border-color:#426c42}
.green{width:100%;border:0;background:#28572d;color:white;padding:19px;border-radius:15px;font-size:20px;margin-top:18px}
.heart-link{text-align:right;margin:30px 5px 70px;color:#777;font-size:19px;cursor:pointer}
.line{border:0;border-top:1px solid #ddd;margin:0 0 40px}
.section-title{font-size:29px;font-weight:400;margin:0 0 20px}
.date-title{font-size:19px;color:#777;margin:30px 0 22px}
.post{margin-bottom:38px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mini{width:42px;height:42px;border-radius:50%;background:#e8eee7;overflow:hidden;display:grid;place-items:center;color:#315a32;flex-shrink:0}
.mini img{width:100%;height:100%;object-fit:cover}
.post-name{font-size:17px}
.verified{color:#fff;background:#777;border-radius:50%;font-size:11px;padding:2px 5px}
.post-time{color:#777;font-size:16px}
.post-body{margin-left:52px}
.post-text{font-size:17px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.post-image{width:100%;max-width:445px;max-height:620px;object-fit:contain;display:block;border-radius:0 28px 28px 28px;margin-top:8px;background:#f5f5f5}
.post-actions{display:flex;justify-content:flex-end;gap:18px;margin-top:12px;color:#777;font-size:22px}
.love{cursor:pointer}
.love.active{color:#d65c69}
.empty{text-align:center;color:#aaa;padding:65px 10px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 28px}
.toolbar input{flex:1;min-width:130px;padding:12px;font-size:14px}
.small-btn{border:1px solid #ddd;background:white;border-radius:12px;padding:10px 14px;color:#555}
.small-btn.active{background:#28572d;color:white;border-color:#28572d}
.admin{background:#fafafa;border:1px solid #eee;border-radius:18px;padding:20px;margin:28px 0}
.admin h3{font-weight:500;margin:0 0 15px}
.admin label{display:block;font-size:14px;color:#777;margin:13px 0 7px}
.admin input,.admin textarea{font-size:15px;padding:12px;border-radius:10px;background:white}
.admin textarea{min-height:95px;resize:vertical}
.admin .green{font-size:16px;padding:13px;margin-top:15px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#f6f6f6;display:flex;justify-content:center;align-items:center;gap:100px;border-top:1px solid #eee;z-index:5}
.bottom button{border:0;background:none;font-size:30px;color:#333}
.hidden{display:none!important}
footer{text-align:center;color:#aaa;font-size:12px;margin-top:60px}
@media(max-width:500px){
.wrap{padding:40px 22px 90px}
.profile h1{font-size:34px}
.avatar{width:76px;height:76px}
.section-title{font-size:26px}
.post-body{margin-left:48px}
}
</style>
</head>
<body>
<div class="top">
  <div><b>ZEUS POP</b><small>CHOI WOO-JE · PERSONAL ARCHIVE</small></div>
</div>

<main class="wrap">
  <section id="home">
    <div class="profile">
      <div class="avatar" id="avatar">ZEUS</div>
      <h1>ZEUS POP</h1>
    </div>

    <div class="label">닉네임</div>
    <input id="nickname" placeholder="输入你的昵称" maxlength="30">
    <button class="green" onclick="enterPop()">팝 구경하기</button>
    <div class="heart-link" onclick="showFavorites()">♡ 하트 모아보기</div>
  </section>

  <hr class="line">

  <section id="archive">
    <h2 class="section-title" id="archiveTitle">1년 전 오늘의 우제</h2>
    <div class="toolbar">
      <input id="search" placeholder="搜索聊天记录..." oninput="render()">
      <input id="fromDate" type="date" onchange="render()" aria-label="开始日期">
      <input id="toDate" type="date" onchange="render()" aria-label="结束日期">
      <button class="small-btn" onclick="clearFilters()">重置</button>
    </div>

    <div id="posts"></div>
    <div class="bottom">
      <button onclick="changePage(-1)">‹</button>
      <button onclick="changePage(1)">›</button>
    </div>
  </section>

  <section class="admin" id="editor">
    <h3>✦ 기록 추가하기 / 添加聊天记录</h3>
    <label>选手昵称</label>
    <input id="playerName" value="최우제">
    <label>日期</label>
    <input id="postDate" type="date">
    <label>时间</label>
    <input id="postTime" type="time" value="17:12">
    <label>聊天内容</label>
    <textarea id="postText" placeholder="输入聊天内容..."></textarea>
    <label>上传图片（可选）</label>
    <input id="postImage" type="file" accept="image/*">
    <button class="green" onclick="savePost()">+ 기록 저장하기</button>
    <button class="small-btn hidden" id="cancelEdit" onclick="resetEditor()">取消编辑</button>
    <div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap">
      <button class="small-btn" onclick="exportData()">导出备份</button>
      <button class="small-btn" onclick="document.getElementById('importFile').click()">恢复备份</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(event)">
      <button class="small-btn" onclick="document.getElementById('avatarFile').click()">更换头像</button>
      <input id="avatarFile" type="file" accept="image/*" hidden onchange="changeAvatar(event)">
    </div>
  </section>

  <footer>ZEUS POP · 개인 소장용 아카이브</footer>
</main>

<script>
const KEY="zeus_pop_posts_v1";
const PROFILE="zeus_pop_profile_v1";
let posts=JSON.parse(localStorage.getItem(KEY)||"[]");
let profile=JSON.parse(localStorage.getItem(PROFILE)||"{}");
let page=0, favoritesOnly=false, editingId=null;

function persist(){
  localStorage.setItem(KEY,JSON.stringify(posts));
  localStorage.setItem(PROFILE,JSON.stringify(profile));
}
function enterPop(){
  const n=document.getElementById("nickname").value.trim();
  profile.nickname=n;
  persist();
  document.getElementById("archive").scrollIntoView({behavior:"smooth"});
}
function showFavorites(){
  favoritesOnly=true;
  page=0;
  document.getElementById("archiveTitle").textContent="♡ 하트 모아보기";
  render();
  document.getElementById("archive").scrollIntoView({behavior:"smooth"});
}
function clearFilters(){
  favoritesOnly=false;page=0;
  document.getElementById("search").value="";
  document.getElementById("fromDate").value="";
  document.getElementById("toDate").value="";
  document.getElementById("archiveTitle").textContent="1년 전 오늘의 우제";
  render();
}
function changePage(n){
  const total=Math.ceil(filtered().length/10);
  page=Math.max(0,Math.min(Math.max(0,total-1),page+n));
  render();
}
function filtered(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const from=document.getElementById("fromDate").value;
  const to=document.getElementById("toDate").value;
  return posts.filter(p=>{
    if(favoritesOnly&&!p.favorite)return false;
    if(q&&!((p.text||"").toLowerCase().includes(q)||(p.name||"").toLowerCase().includes(q)))return false;
    if(from&&p.date<from)return false;
    if(to&&p.date>to)return false;
    return true;
  }).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
}
function render(){
  const list=filtered();
  const shown=list.slice(page*10,page*10+10);
  const root=document.getElementById("posts");
  if(!shown.length){
    root.innerHTML='<div class="empty">아직 기록이 없어요 ♡<br><small>在下方添加第一条聊天记录吧</small></div>';
    return;
  }
  let html="",last="";
  shown.forEach(p=>{
    if(last!==p.date){
      const d=new Date(p.date+"T12:00:00");
      const dateText=p.date.replaceAll("-",".")+" "+["日","一","二","三","四","五","六"][d.getDay()];
      html+='<div class="date-title">'+dateText+'</div>';
      last=p.date;
    }
    const image=p.image?'< img class="post-image" src="'+p.image+'" alt="聊天图片">':"";
    html+='<article class="post"><div class="post-head"><div class="mini">'+(profile.avatar?'< img src="'+profile.avatar+'">':'Z')+'</div><span class="post-name">'+esc(p.name||"최우제")+'</span><span class="verified">✓</span><span class="post-time">'+esc(p.time||"")+'</span></div><div class="post-body">'+(p.text?'<div class="post-text">'+esc(p.text)+'</div>':"")+image+'</div><div class="post-actions"><span class="love '+(p.favorite?"active":"")+'" onclick="toggleLove('+p.id+')">'+(p.favorite?"♥":"♡")+'</span><button class="small-btn" onclick="editPost('+p.id+')">编辑</button><button class="small-btn" onclick="deletePost('+p.id+')">删除</button></div></article>';
  });
  root.innerHTML=html;
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function compress(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,1400/img.width);
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg",.78));
      };
      img.onerror=reject;img.src=reader.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}
async function savePost(){
  const date=document.getElementById("postDate").value;
  const time=document.getElementById("postTime").value;
  const text=document.getElementById("postText").value.trim();
  const name=document.getElementById("playerName").value.trim()||"최우제";
  const file=document.getElementById("postImage").files[0];
  if(!date){alert("请先选择日期");return}
  if(!text&&!file){alert("请填写内容或上传图片");return}
  try{
    let image=file?await compress(file):"";
    if(editingId!==null){
      const p=posts.find(x=>x.id===editingId);
      if(p){p.date=date;p.time=time;p.text=text;p.name=name;if(file)p.image=image}
    }else{
      posts.push({id:Date.now(),date,time,text,name,image,favorite:false});
    }
    persist();resetEditor();page=0;render();
    alert("保存成功！");
  }catch(e){alert("图片处理失败，请换一张图片再试。")}
}
function resetEditor(){
  editingId=null;
  ["postText","postImage"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("postDate").value=new Date().toISOString().slice(0,10);
  document.getElementById("postTime").value="17:12";
  document.getElementById("cancelEdit").classList.add("hidden");
}
function editPost(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  editingId=id;
  document.getElementById("playerName").value=p.name;
  document.getElementById("postDate").value=p.date;
  document.getElementById("postTime").value=p.time;
  document.getElementById("postText").value=p.text;
  document.getElementById("cancelEdit").classList.remove("hidden");
  document.getElementById("editor").scrollIntoView({behavior:"smooth"});
}
function deletePost(id){
  if(!confirm("确定删除这条记录吗？"))return;
  posts=posts.filter(p=>p.id!==id);persist();render();
}
function toggleLove(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  p.favorite=!p.favorite;persist();render();
}
async function changeAvatar(e){
  const f=e.target.files[0];if(!f)return;
  try{
    profile.avatar=await compress(f);persist();render();
    document.getElementById("avatar").innerHTML='< img src="'+profile.avatar+'">';
  }catch(err){alert("头像上传失败")}
}
function exportData(){
  const data={posts,profile};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="zeus-pop-backup.json";a.click();
  URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data.posts))throw Error();
      if(!confirm("恢复备份会替换当前记录，确定继续吗？"))return;
      posts=data.posts;profile=data.profile||{};persist();render();alert("恢复成功");
    }catch(err){alert("备份文件格式不正确")}
  };
  r.readAsText(f);e.target.value="";
}
if(profile.nickname)document.getElementById("nickname").value=profile.nickname;
if(profile.avatar)document.getElementById("avatar").innerHTML='< img src="'+profile.avatar+'">';
document.getElementById("postDate").value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
